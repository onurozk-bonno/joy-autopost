name: Haftalık insights raporu

on:
  schedule:
    - cron: "0 7 * * 1"   # Pazartesi 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Rapor üret (izin yoksa uyarı verip yeşil biter)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python "$(git ls-files | grep -E '(^|/)insights\.py$' | head -1)"

      - name: Raporu commit'le
        run: |
          if [ -n "$(git status --porcelain reports)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports
            git commit -m "Haftalık insights raporu"
            git push
          else
            echo "Yeni rapor yok."
          fi
